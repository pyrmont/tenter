# Forwards webhook requests from an HTTPS server block to Tenter. Put this
# location block in the server block for the host that GitHub sends webhooks
# to, after its TLS settings.

location /run/ {
    # Tenter refuses bodies over 1 MiB; stop them here instead.
    client_max_body_size 1m;

    # nginx reads the whole request before passing it on (the default), so a
    # slow client is held by nginx, not by Tenter.
    proxy_request_buffering on;

    proxy_pass http://127.0.0.1:4567;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
